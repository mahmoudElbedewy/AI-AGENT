<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - مساعد كودكس</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0f;
            color: #f0f0f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .register-card {
            background: #1a1a1f;
            padding: 30px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4);
        }
        .register-card h2 { text-align: center; margin-bottom: 25px; font-size: 22px; color: #f0f0f5; }
        .input-group { margin-bottom: 18px; }
        .input-group input {
            width: 100%;
            padding: 12px 16px;
            background: #0d0d0f;
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }
        .input-group input:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2); }
        .register-btn {
            width: 100%;
            padding: 12px;
            background: #3b82f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .register-btn:hover { background: #2563eb; }
        .error-msg {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #ef4444;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .login-link { text-align: center; margin-top: 20px; font-size: 14px; }
        .login-link a { color: #3b82f6; text-decoration: none; }
        .login-link a:hover { text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>إنشاء حساب جديد</h2>
        <div id="error-box" class="error-msg"></div>
        
        <form id="register-form">
            <div class="input-group">
                <input type="text" id="username" placeholder="اسم المستخدم (إنجليزي)" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            <div class="input-group">
                <input type="password" id="confirm_password" placeholder="تأكيد كلمة المرور" required>
            </div>
            <button type="submit" class="register-btn">تسجيل الحساب</button>
        </form>

        <div class="login-link">
            <p>لديك حساب بالفعل؟ <a href="/login/">تسجيل الدخول</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const errorBox = document.getElementById('error-box');
            
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirm_password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_data', JSON.stringify(data.user_data));
                    window.location.href = '/';
                } else {
                    errorBox.textContent = data.error || 'فشل تسجيل الحساب';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'مشكلة في الاتصال بالسيرفر';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
