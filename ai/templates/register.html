<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد - مساعد كودكس</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Markazi+Text:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #1f1d1a;
            --fg: #f6f1e7;
            --fg-secondary: #a39a8c;
            --placeholder: #8a8276;
            --input-bg: rgba(255, 255, 255, 0.05);
            --input-border: rgba(255, 255, 255, 0.13);
            --input-border-focus: rgba(246, 241, 231, 0.45);
            --btn-bg: #f9f5ec;
            --btn-text: #1f1d1a;
            --error-bg: rgba(216, 119, 87, 0.12);
            --error-border: rgba(216, 119, 87, 0.35);
            --error-text: #e2916f;
            --radius-input: 10px;
            --radius-btn: 8px;
            --font-display: 'Markazi Text', serif;
            --font-body: 'Tajawal', sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body);
            background-color: var(--bg);
            background-image: radial-gradient(120% 90% at 15% 0%, rgba(255, 255, 255, 0.05), transparent 55%);
            color: var(--fg);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .register-card {
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
        }

        .register-card h2 {
            font-family: var(--font-display);
            font-weight: 600;
            text-align: center;
            margin-bottom: 32px;
            font-size: 34px;
            letter-spacing: -0.3px;
            color: var(--fg);
        }

        .input-group { margin-bottom: 18px; }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--fg-secondary);
            font-size: 14px;
            font-weight: 500;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: var(--radius-input);
            color: var(--fg);
            font-size: 14px;
            font-family: var(--font-body);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .input-group input::placeholder { color: var(--placeholder); }
        .input-group input:focus {
            border-color: var(--input-border-focus);
            background: rgba(255, 255, 255, 0.07);
        }

        .register-btn {
            width: 100%;
            margin-top: 6px;
            padding: 12px;
            background: var(--btn-bg);
            color: var(--btn-text);
            border: none;
            border-radius: var(--radius-btn);
            font-size: 15px;
            font-weight: 700;
            font-family: var(--font-body);
            cursor: pointer;
            transition: opacity 0.2s, transform 0.15s;
        }
        .register-btn:hover { opacity: 0.88; }
        .register-btn:active { transform: scale(0.98); }

        .error-msg {
            background: var(--error-bg);
            border: 1px solid var(--error-border);
            color: var(--error-text);
            padding: 10px 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            font-size: 13px;
            display: none;
            text-align: center;
        }

        .login-link { text-align: center; margin-top: 28px; font-size: 13px; color: var(--fg-secondary); }
        .login-link a { color: var(--fg); font-weight: 700; text-decoration: none; transition: opacity 0.2s; }
        .login-link a:hover { opacity: 0.75; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="register-card">
        <h2>إنشاء حساب جديد</h2>
        <div id="error-box" class="error-msg"></div>
        
        <form id="register-form">
            <div class="input-group">
                <label for="username">اسم المستخدم</label>
                <input type="text" id="username" placeholder="اسم المستخدم (إنجليزي)" required>
            </div>
            <div class="input-group">
                <label for="password">كلمة المرور</label>
                <input type="password" id="password" placeholder="كلمة المرور" required>
            </div>
            <div class="input-group">
                <label for="confirm_password">تأكيد كلمة المرور</label>
                <input type="password" id="confirm_password" placeholder="تأكيد كلمة المرور" required>
            </div>
            <button type="submit" class="register-btn">تسجيل الحساب</button>
        </form>

        <div class="login-link">
            <p>لديك حساب بالفعل؟ <a href="/login/">تسجيل الدخول</a></p>
        </div>
    </div>

    <script>
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const errorBox = document.getElementById('error-box');
            
            errorBox.style.display = 'none';

            try {
                const response = await fetch('/api/register/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, confirm_password })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_data', JSON.stringify(data.user_data));
                    window.location.href = '/';
                } else {
                    errorBox.textContent = data.error || 'فشل تسجيل الحساب';
                    errorBox.style.display = 'block';
                }
            } catch (err) {
                errorBox.textContent = 'مشكلة في الاتصال بالسيرفر';
                errorBox.style.display = 'block';
            }
        });
    </script>
</body>
</html>
