    <script>
      // ── marked config ────────────────────────────────────────────────
      marked.setOptions({ gfm: true, breaks: true });
      const renderer = new marked.Renderer();
      renderer.code = function (code, lang) {
        const langLabel = lang || "code";
        const raw = typeof code === "object" ? code.text : code;
        const escaped = escHtml(raw);
        const encoded = btoa(unescape(encodeURIComponent(raw)));
        return `<div class="code-block">
<div class="code-toolbar">
  <span class="code-lang">${escHtml(langLabel)}</span>
  <div class="code-actions">
    <button class="code-action-btn" onclick="reloadCodeBlock(this)">
      <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>تحديث
    </button>
    <button class="code-action-btn" onclick="copyCodeBlock(this,'${encoded}')">
      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>نسخ
    </button>
  </div>
</div>
<div class="code-body"><pre><code>${escaped}</code></pre></div>
</div>`;
      };
      marked.setOptions({ renderer });

      // ── DOM refs ─────────────────────────────────────────────────────
      const messageInput = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const messagesDiv = document.getElementById("messages");
      const messagesWrap = document.getElementById("messages-wrap");
      const attachBtn = document.getElementById("attach-btn");
      const fileInput = document.getElementById("file-input");
      const pendingPreview = document.getElementById("pending-preview");
      const ppName = document.getElementById("pp-name");
      const ppType = document.getElementById("pp-type");
      const ppRemove = document.getElementById("pp-remove");
      const ppVisual = document.getElementById("pp-visual");
      const themeBtn = document.getElementById("theme-btn");
      const iconMoon = document.getElementById("icon-moon");
      const iconSun = document.getElementById("icon-sun");
      const lightbox = document.getElementById("lightbox");
      const lightboxImg = document.getElementById("lightbox-img");
      const lightboxDl = document.getElementById("lightbox-dl");
      const welcomeScreen = document.getElementById("welcome-screen");
      const suggestFab = document.getElementById("suggestions-fab");
      const suggestPanel = document.getElementById("suggestions-panel");
      const inputHint = document.getElementById("input-hint");

      // ── Mobile detection ─────────────────────────────────────────────
      const isMobile =
        /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent
        );
      let currentConversationId = null;
      let isIntentionalDisconnect = false;
      let activeChip = null;
      if (isMobile)
        inputHint.textContent = "اضغط زرار الإرسال للإرسال · Enter سطر جديد";

      // ── Theme ────────────────────────────────────────────────────────
      let currentTheme = localStorage.getItem("chat-theme") || "dark";
      applyTheme(currentTheme);
      themeBtn.onclick = () => {
        currentTheme = currentTheme === "dark" ? "light" : "dark";
        applyTheme(currentTheme);
        localStorage.setItem("chat-theme", currentTheme);
      };
      function applyTheme(t) {
        document.documentElement.setAttribute("data-theme", t);
        iconMoon.style.display = t === "dark" ? "block" : "none";
        iconSun.style.display = t === "light" ? "block" : "none";
      }

      // ── Suggestions data ──────────────────────────────────────────────
      const SUGGESTIONS = [
        {
          icon: "📄",
          title: "تحليل PDF",
          chipPrompt:
            "[CMD:PDF] SYSTEM INSTRUCTION: You are handed an uploaded PDF document. Your absolute and mandatory priority is to thoroughly read, parse, and analyze the document context. Extract all critical data points, core insights, and explicit facts. Do not hallucinate. Provide a comprehensive, highly detailed response directly addressing this query: ",
        },
        {
          icon: "🎨",
          title: "توليد صورة",
          chipPrompt:
            "[CMD:IMAGE] COMMAND: IMAGE_GENERATION_REQUEST. You MUST instantly trigger your internal image generation tool or pipeline. DO NOT write Python code explanations, DO NOT output markdown code blocks like 'print(generate_image())', and DO NOT just reply with text banter. Focus entirely on rendering a professional, hyper-realistic, high-quality, creative visual scene based exactly on this description: ",
        },
        {
          icon: "🖼️",
          title: "تحليل صورة",
          chipPrompt:
            "[CMD:ANALYZE_IMAGE] SYSTEM INSTRUCTION: Deeply examine the uploaded image file with high fidelity. Analyze all visual elements, context, metadata, and embeded text (OCR) inside the image. Provide an exhaustive, precise, and definitive breakdown answering this specific user request: ",
        },
        {
          icon: "🔍",
          title: "بحث إنترنت",
          chipPrompt:
            "[CMD:SEARCH] COMMAND: WEB_SEARCH_REQUIRED. You MUST utilize your live internet search tool (Tavily) to fetch the absolute latest, real-time factual data, news, and records for the current year. Synthesize multiple top-tier sources into a verified, well-structured, and comprehensive up-to-date report covering: ",
        },
        {
          icon: "🧮",
          title: "حسابات",
          chipPrompt:
            "[CMD:CALC] SYSTEM INSTRUCTION: Treat this request as a rigorous mathematical or logical computational problem. Solve the equation or logic puzzle systematically step-by-step. Double-check all calculations for absolute mathematical accuracy, explain the underlying formula/methodology clearly, and deliver the final precise solution for: ",
        },
        {
          icon: "✍️",
          title: "تلخيص نص",
          chipPrompt:
            "[CMD:SUMMARY] SYSTEM INSTRUCTION: Execute a high-density, professional contextual summarization of the following text. You MUST extract all primary arguments, underlying concepts, and essential facts without omitting vital details. Organize the output into an executive summary followed by analytical bullet points for: ",
        },
        {
          icon: "📺",
          title: "تلخيص يوتيوب",
          chipPrompt:
            "[CMD:YOUTUBE] COMMAND: YOUTUBE_SUMMARIZATION. You MUST invoke your dedicated YouTube tool to extract the complete video transcript from the link provided. Thoroughly parse the video content, structure the information timeline-by-timeline, and generate an exhaustive summary highlighting key takeaways and core concepts: ",
        },
        {
          icon: "📝",
          title: "إنشاء Word",
          chipPrompt:
            "[CMD:WORD] COMMAND: CREATE_WORD_DOCUMENT. You MUST execute your document generation pipeline to create a beautifully formatted, structured, and formal Microsoft Word (.docx) file. Organize it with proper headings, clear paragraphs, and clean layouts based on the following content requirements: ",
        },
        {
          icon: "📊",
          title: "إنشاء Excel",
          chipPrompt:
            "[CMD:EXCEL] COMMAND: CREATE_EXCEL_SPREADSHEET. You MUST invoke your spreadsheet automation framework to generate an organized, production-ready Excel (.xlsx) workbook. Design it with bold table headers, clear color-coded indicators, formatted data rows, and logical distributions according to: ",
        },
        {
          icon: "💻",
          title: "تنفيذ كود",
          chipPrompt:
            "[CMD:CODE] COMMAND: PYTHON_SANDBOX_EXECUTION. You MUST write clean, optimal, and functional Python code, then execute it immediately within your sandboxed runtime environment. Do not just show the code—run it, handle any potential script exceptions, and print the definitive raw execution output and logical outcome for: ",
        },
      ];

      // Build welcome caps + suggestions panel
      const wcGrid = document.getElementById("welcome-caps-grid");
      const spGrid = document.getElementById("sp-grid");
      SUGGESTIONS.forEach((s) => {
        const wc = document.createElement("div");
        wc.className = "welcome-cap";
        wc.innerHTML = `<span class="cap-icon">${s.icon}</span><span class="cap-title">${s.title}</span>`;
        wc.onclick = () => activateChip(s);
        wcGrid.appendChild(wc);

        const sc = document.createElement("div");
        sc.className = "sp-cap";
        sc.innerHTML = `<span class="cap-icon">${s.icon}</span><span class="cap-title">${s.title}</span>`;
        sc.onclick = () => {
          activateChip(s);
          suggestPanel.classList.remove("open");
        };
        spGrid.appendChild(sc);
      });

      // Suggestions FAB
      suggestFab.onclick = (e) => {
        e.stopPropagation();
        suggestPanel.classList.toggle("open");
      };
      document.getElementById("sp-close-btn").onclick = () =>
        suggestPanel.classList.remove("open");
      document.addEventListener("click", (e) => {
        if (!suggestPanel.contains(e.target) && e.target !== suggestFab)
          suggestPanel.classList.remove("open");
      });

      function activateChip(suggestion) {
        activeChip = suggestion;
        document.getElementById("chip-icon-el").textContent = suggestion.icon;
        document.getElementById("chip-label-el").textContent = suggestion.title;
        document.getElementById("active-chip").classList.add("visible");
        messageInput.value = "";
        messageInput.focus();
      }
      document.getElementById("chip-remove-btn").onclick = () => {
        activeChip = null;
        document.getElementById("active-chip").classList.remove("visible");
        messageInput.value = "";
      };

      function hideWelcome() {
        if (!welcomeScreen || welcomeScreen.style.display === "none") return;
        welcomeScreen.classList.add("hiding");
        setTimeout(() => {
          welcomeScreen.style.display = "none";
          welcomeScreen.classList.remove("hiding");
        }, 300);
        suggestFab.classList.add("visible");
      }

      // ── Lightbox ──────────────────────────────────────────────────────
      function openLightbox(src, filename) {
        lightboxImg.src = src;
        lightboxDl.href = src;
        lightboxDl.download = filename || "image.png";
        lightbox.classList.add("open");
      }
      function closeLightbox() {
        lightbox.classList.remove("open");
      }

      // ── PDF Modal ─────────────────────────────────────────────────────
      function openPdfModal(src, name) {
        document.getElementById("pdfModalTitle").textContent =
          name || "عرض الملف";
        document.getElementById("pdfModalFrame").src = src;
        document.getElementById("pdfModal").classList.add("open");
      }
      function closePdfModal() {
        document.getElementById("pdfModal").classList.remove("open");
        setTimeout(() => {
          document.getElementById("pdfModalFrame").src = "";
        }, 300);
      }

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeLightbox();
          closePdfModal();
        }
      });

      // ── Code actions ──────────────────────────────────────────────────
      function copyCodeBlock(btn, encoded) {
        try {
          const text = decodeURIComponent(escape(atob(encoded)));
          navigator.clipboard.writeText(text).then(() => {
            btn.classList.add("copied");
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="20 6 9 17 4 12"/></svg> تم النسخ`;
            setTimeout(() => {
              btn.classList.remove("copied");
              btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> نسخ`;
            }, 2000);
          });
        } catch (e) {}
      }
      function reloadCodeBlock(btn) {
        const block = btn.closest(".code-block");
        if (!block) return;
        block.style.opacity = "0.4";
        setTimeout(() => (block.style.opacity = "1"), 350);
      }

      // ── Auth ──────────────────────────────────────────────────────────
      const token = localStorage.getItem("access_token");
      if (!token) window.location.href = "/login/";
      const userData = JSON.parse(localStorage.getItem("user_data") || "{}");
      const nameChip = document.getElementById("user-name-chip");
      if (nameChip && userData.name) {
        nameChip.textContent = userData.name;
        // Set avatar initials
        const initials = userData.name.charAt(0).toUpperCase();
        document.getElementById("user-avatar-sidebar").textContent = initials;
        document.getElementById("nav-avatar").textContent = initials;
        // Set welcome name
        const wn = document.getElementById("welcome-name");
        if (wn) wn.textContent = userData.name;
      }
      document.getElementById("logout-btn").onclick = () => {
        localStorage.removeItem("access_token");
        localStorage.removeItem("user_data");
        window.location.href = "/login/";
      };

      // ── Streaming state ───────────────────────────────────────────────
      let isStreaming = false;
      let streamStopped = false;
      const SEND_SVG = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`;
      const STOP_SVG = `<svg viewBox="0 0 24 24" style="fill:currentColor;stroke:none"><rect x="5" y="5" width="14" height="14" rx="2.5"/></svg>`;

      function setStreamingUI(on) {
        isStreaming = on;
        if (on) {
          sendBtn.innerHTML = STOP_SVG;
          sendBtn.classList.add("stop-mode");
          sendBtn.disabled = false;
          sendBtn.title = "إيقاف الرد";
        } else {
          sendBtn.innerHTML = SEND_SVG;
          sendBtn.classList.remove("stop-mode");
          sendBtn.disabled = false;
          sendBtn.title = "إرسال";
        }
      }

      // ── WebSocket ─────────────────────────────────────────────────────
      const ws_scheme = window.location.protocol === "https:" ? "wss" : "ws";
      let guestId = localStorage.getItem("guest_chat_id");
      if (!guestId) {
        guestId = crypto.randomUUID();
        localStorage.setItem("guest_chat_id", guestId);
      }

      let chatSocket,
        typingRow = null,
        pendingFile = null;
      let queuedText = null,
        currentBotBubble = null,
        streamBuffer = "";
      let reconnectAttempts = 0,
        reconnectTimer = null,
        disconnectBanner = null;

      function buildWsUrl(conversationId) {
        let url =
          ws_scheme +
          "://" +
          window.location.host +
          "/ws/chat/?token=" +
          encodeURIComponent(token) +
          "&guest_id=" +
          encodeURIComponent(guestId);
        if (conversationId)
          url += "&conversation_id=" + encodeURIComponent(conversationId);
        return url;
      }

      function connectWebSocket(conversationId) {
        chatSocket = new WebSocket(buildWsUrl(conversationId || null));
        chatSocket.onopen = () => {
          reconnectAttempts = 0;
          clearTimeout(reconnectTimer);
          isIntentionalDisconnect = false;
          if (disconnectBanner) {
            disconnectBanner.remove();
            disconnectBanner = null;
            sendBtn.disabled = false;
          }
        };
        chatSocket.onclose = () => {
          if (isIntentionalDisconnect) return;
          if (reconnectTimer) return;
          showDisconnectBanner();
          scheduleReconnect();
        };
      }

      function showDisconnectBanner() {
        if (disconnectBanner) return;
        disconnectBanner = document.createElement("div");
        disconnectBanner.className = "msg-row bot";
        const av = mkAv();
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble disc-bubble";
        bubble.innerHTML = `<span>انقطع الاتصال · جاري إعادة الاتصال</span><span class="disc-spinner"></span>`;
        disconnectBanner.appendChild(av);
        disconnectBanner.appendChild(bubble);
        messagesDiv.appendChild(disconnectBanner);
        scrollBottom();
        sendBtn.disabled = true;
      }

      function scheduleReconnect() {
        if (isIntentionalDisconnect) return;
        const delay = Math.min(2000 * Math.pow(2, reconnectAttempts), 15000);
        reconnectAttempts++;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = null;
          if (isIntentionalDisconnect) return;
          connectWebSocket(currentConversationId);
          attachSocketHandlers();
        }, delay);
      }

      function attachSocketHandlers() {
        chatSocket.onmessage = function (e) {
          const data = JSON.parse(e.data);
          if (data.type === "session_info") {
            renderConversations(data.conversations || []);
            if (data.deleted_current) {
              isIntentionalDisconnect = true;
              clearTimeout(reconnectTimer);
              if (chatSocket) {
                chatSocket.onclose = null;
                chatSocket.close();
              }
              resetChatUI();
              currentConversationId = null;
              closeSidebar();
              connectWebSocket(null);
              attachSocketHandlers();
            } else {
              currentConversationId = data.conversation_id;
            }
            return;
          }
          if (data.type === "history") {
            if (data.messages.length > 0) {
              hideWelcome();
              data.messages.forEach((msg) => {
                if (msg.role === "bot") appendBotMessage(msg.message);
                else appendUserText(msg.message);
              });
              scrollBottom();
            }
            return;
          }
          if (data.type === "stream_start") {
            if (typingRow) {
              typingRow.remove();
              typingRow = null;
            }
            streamBuffer = "";
            streamStopped = false;
            const row = document.createElement("div");
            row.className = "msg-row bot";
            currentBotBubble = document.createElement("div");
            currentBotBubble.className = "msg-bubble";
            row.appendChild(mkAv());
            row.appendChild(currentBotBubble);
            messagesDiv.appendChild(row);
            setStreamingUI(true);
            scrollBottom();
            return;
          }
          if (data.type === "stream_chunk") {
            if (streamStopped) return;
            streamBuffer += data.chunk;
            if (currentBotBubble) {
              currentBotBubble.innerHTML = marked.parse(streamBuffer);
              scrollBottom();
            }
            return;
          }
          if (data.type === "stream_replace") {
            if (streamStopped) return;
            streamBuffer = data.text || "";
            if (currentBotBubble) {
              currentBotBubble.innerHTML = marked.parse(streamBuffer);
              scrollBottom();
            }
            return;
          }
          if (data.type === "stream_end") {
            setStreamingUI(false);
            currentBotBubble = null;
            streamBuffer = "";
            streamStopped = false;
            if (queuedText !== null) {
              const txt = queuedText;
              queuedText = null;
              setTimeout(() => {
                chatSocket.send(JSON.stringify({ message: txt }));
                typingRow = appendThinking();
                sendBtn.disabled = true;
              }, 100);
            } else {
              sendBtn.disabled = false;
            }
            return;
          }
          if (data.type === "file_download") {
            const bytes = Uint8Array.from(atob(data.file_data), (c) =>
              c.charCodeAt(0)
            );
            const blob = new Blob([bytes], { type: data.mime_type });
            const url = URL.createObjectURL(blob);
            const isWord = data.file_name.endsWith(".docx");
            const row = document.createElement("div");
            row.className = "msg-row bot";
            const bubble = document.createElement("div");
            bubble.className = "msg-bubble";
            bubble.innerHTML = buildFileDownloadHTML(
              url,
              data.file_name,
              isWord
            );
            row.appendChild(mkAv());
            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            scrollBottom();
            return;
          }
          if (data.type === "generated_image") {
            messagesDiv.appendChild(
              buildImageRow(
                `data:${data.mime_type || "image/png"};base64,${
                  data.image_data
                }`,
                "generated-image.png",
                true
              )
            );
            scrollBottom();
            return;
          }
          if (typingRow) {
            typingRow.remove();
            typingRow = null;
          }
          appendBotMessage(data.reply);
          if (queuedText !== null) {
            const txt = queuedText;
            queuedText = null;
            setTimeout(() => {
              chatSocket.send(JSON.stringify({ message: txt }));
              typingRow = appendThinking();
              sendBtn.disabled = true;
            }, 100);
          } else {
            sendBtn.disabled = false;
          }
        };
      }
      connectWebSocket(null);
      attachSocketHandlers();

      function buildFileDownloadHTML(url, fileName, isWord) {
        return `<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--r-lg);cursor:pointer;" onclick="window.open('${url}')">
    <div style="width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:${
      isWord ? "#2B579A" : "#1D6F42"
    };">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="white">${
        isWord
          ? '<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8" stroke="white" stroke-width="1.5" fill="none"/>'
          : '<rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="white" stroke-width="1.5"/><line x1="3" y1="9" x2="21" y2="9" stroke="white" stroke-width="1.5"/>'
      }</svg>
    </div>
    <div style="flex:1;min-width:0;">
      <div style="color:var(--text-primary);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;">${fileName}</div>
      <div style="color:var(--text-muted);font-size:11px;margin-top:3px;">${
        isWord ? "Word Document" : "Excel Spreadsheet"
      } · اضغط للتنزيل</div>
    </div>
    <a href="${url}" download="${fileName}" style="color:var(--accent);font-size:12px;white-space:nowrap;text-decoration:none;" onclick="event.stopPropagation()">⬇ تنزيل</a>
  </div>`;
      }

      // ── Attach ────────────────────────────────────────────────────────
      attachBtn.onclick = () => fileInput.click();
      fileInput.onchange = function () {
        const file = fileInput.files[0];
        if (!file) return;
        const isPdf = file.type === "application/pdf";
        const isImg = file.type.startsWith("image/");
        if (!isPdf && !isImg) {
          alert("الملفات المدعومة: PDF أو صور فقط");
          fileInput.value = "";
          return;
        }
        const reader = new FileReader();
        reader.onload = (ev) => {
          const b64 = ev.target.result.split(",")[1];
          const objURL = isPdf ? null : URL.createObjectURL(file);
          const pdfURL = isPdf
            ? URL.createObjectURL(
                new Blob([Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))], {
                  type: "application/pdf",
                })
              )
            : null;
          pendingFile = {
            name: file.name,
            type: isPdf ? "pdf" : "image",
            b64,
            objectURL: objURL,
            pdfURL,
          };
          ppVisual.innerHTML = "";
          if (isPdf) {
            const ic = document.createElement("div");
            ic.className = "pp-icon";
            ic.textContent = "📄";
            ppVisual.appendChild(ic);
          } else {
            const im = document.createElement("img");
            im.className = "pp-thumb";
            im.src = objURL;
            ppVisual.appendChild(im);
          }
          ppName.textContent = file.name;
          ppType.textContent = isPdf
            ? "ملف PDF · اضغط للمعاينة بعد الإرسال"
            : "صورة";
          pendingPreview.classList.add("visible");
        };
        reader.readAsDataURL(file);
        fileInput.value = "";
      };
      ppRemove.onclick = clearPending;
      function clearPending() {
        if (pendingFile?.objectURL) URL.revokeObjectURL(pendingFile.objectURL);
        pendingFile = null;
        pendingPreview.classList.remove("visible");
        ppVisual.innerHTML = "";
      }

      // ── Send ──────────────────────────────────────────────────────────
      sendBtn.onclick = function () {
        if (isStreaming) {
          streamStopped = true;
          setStreamingUI(false);
          if (currentBotBubble) {
            const stopTag = document.createElement("span");
            stopTag.style.cssText =
              "font-size:11px;color:var(--text-muted);margin-right:8px;display:inline-block;margin-top:4px;";
            stopTag.textContent = "◼ تم الإيقاف";
            currentBotBubble.appendChild(stopTag);
            currentBotBubble = null;
          }
          streamBuffer = "";
          return;
        }
        sendMessage();
      };

      messageInput.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && !e.shiftKey && !isMobile) {
          e.preventDefault();
          sendMessage();
        }
      });

      function sendMessage() {
        if (isRecording && recognition) {
          isRecording = false;
          isStopping = true;
          micBtn.classList.remove("recording");
          recognition.abort();
          originalValue = "";
          finalTranscript = "";
        }
        const text = messageInput.value.trim();
        const hasFile = !!pendingFile,
          hasText = !!text;
        if (!hasFile && !hasText) return;
        if (chatSocket.readyState !== WebSocket.OPEN) return;
        hideWelcome();

        if (hasFile && hasText) {
          const f = pendingFile;
          if (f.type === "pdf") appendUserFileChip(f.name, f.pdfURL);
          else appendUserImage(f.objectURL, f.name);
          appendUserText(text);
          messageInput.value = "";
          messageInput.style.height = "auto";
          clearPending();
          chatSocket.send(
            JSON.stringify(
              f.type === "pdf"
                ? {
                    type: "file",
                    file_name: f.name,
                    file_data: f.b64,
                    message: text,
                  }
                : {
                    type: "image",
                    file_name: f.name,
                    file_data: f.b64,
                    message: text,
                  }
            )
          );
          typingRow = appendThinking();
          sendBtn.disabled = true;
          return;
        }
        if (hasFile) {
          const f = pendingFile;
          if (f.type === "pdf") appendUserFileChip(f.name, f.pdfURL);
          else appendUserImage(f.objectURL, f.name);
          chatSocket.send(
            JSON.stringify(
              f.type === "pdf"
                ? { type: "file", file_name: f.name, file_data: f.b64 }
                : { type: "image", file_name: f.name, file_data: f.b64 }
            )
          );
          clearPending();
          typingRow = appendThinking();
          sendBtn.disabled = true;
          return;
        }
        const userVisibleText = text;
        const actualPrompt = activeChip ? activeChip.chipPrompt + text : text;
        activeChip = null;
        document.getElementById("active-chip").classList.remove("visible");

        appendUserText(userVisibleText);
        messageInput.value = "";
        messageInput.style.height = "auto";
        chatSocket.send(JSON.stringify({ message: actualPrompt }));
        typingRow = appendThinking();
        sendBtn.disabled = true;
      }

      // ── Render helpers ────────────────────────────────────────────────
      function mkAv() {
        const av = document.createElement("div");
        av.className = "bot-av";
        av.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>`;
        return av;
      }

      function appendUserText(text) {
        const row = document.createElement("div");
        row.className = "msg-row user";
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerText = text;
        row.appendChild(bubble);
        messagesDiv.appendChild(row);
        scrollBottom();
        return row;
      }

      function appendBotMessage(text) {
        try {
          const p = JSON.parse(text);
          if (p?.type === "generated_image") {
            if (p.message) appendBotMessage(p.message);
            messagesDiv.appendChild(
              buildImageRow(
                `data:${p.mime_type || "image/png"};base64,${p.image_data}`,
                "generated-image.png",
                true
              )
            );
            scrollBottom();
            return null;
          }
          if (p?.type === "file_download") {
            const bytes = Uint8Array.from(atob(p.file_data), (c) =>
              c.charCodeAt(0)
            );
            const blob = new Blob([bytes], { type: p.mime_type });
            const url = URL.createObjectURL(blob);
            const isWord = p.file_name.endsWith(".docx");
            const row = document.createElement("div");
            row.className = "msg-row bot";
            const bubble = document.createElement("div");
            bubble.className = "msg-bubble";
            bubble.innerHTML = buildFileDownloadHTML(url, p.file_name, isWord);
            row.appendChild(mkAv());
            row.appendChild(bubble);
            messagesDiv.appendChild(row);
            scrollBottom();
            return row;
          }
        } catch (_) {}
        const row = document.createElement("div");
        row.className = "msg-row bot";
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        bubble.innerHTML = marked.parse(text);
        row.appendChild(mkAv());
        row.appendChild(bubble);
        messagesDiv.appendChild(row);
        scrollBottom();
        return row;
      }

      function buildImageRow(src, filename, isBot) {
        const row = document.createElement("div");
        row.className = `msg-row ${isBot ? "bot" : "user"}`;
        if (isBot) row.appendChild(mkAv());
        const bubble = document.createElement("div");
        bubble.className = "msg-bubble";
        const wrapper = document.createElement("div");
        wrapper.className = "img-wrapper";
        const img = document.createElement("img");
        img.src = src;
        img.style.cssText =
          "max-width:100%;max-height:280px;border-radius:12px;cursor:zoom-in;display:block;";
        img.onclick = () => openLightbox(src, filename);
        const dlOverlay = document.createElement("div");
        dlOverlay.className = "img-dl-overlay";
        const dlLink = document.createElement("a");
        dlLink.className = "img-dl-btn";
        dlLink.href = src;
        dlLink.download = filename;
        dlLink.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
        dlLink.onclick = (e) => e.stopPropagation();
        dlOverlay.appendChild(dlLink);
        wrapper.appendChild(img);
        wrapper.appendChild(dlOverlay);
        bubble.appendChild(wrapper);
        if (isBot) {
          const lbl = document.createElement("p");
          lbl.style.cssText =
            "color:var(--text-muted);font-size:11px;margin-top:6px;";
          lbl.textContent = "🎨 الصورة جاهزة";
          bubble.appendChild(lbl);
        }
        row.appendChild(bubble);
        return row;
      }

      function appendUserFileChip(name, pdfURL) {
        const row = document.createElement("div");
        row.className = "msg-row user";
        const chip = document.createElement("div");
        chip.className = "file-chip";
        chip.title = "اضغط للمعاينة";
        chip.innerHTML = `<div class="file-chip-ico">📄</div><div><div class="file-chip-name">${escHtml(
          name
        )}</div><div class="file-chip-sub">${
          pdfURL ? "ملف PDF · اضغط للمعاينة" : "ملف PDF"
        }</div></div>`;
        if (pdfURL) chip.onclick = () => openPdfModal(pdfURL, name);
        row.appendChild(chip);
        messagesDiv.appendChild(row);
        scrollBottom();
        return row;
      }

      function appendUserImage(src, name) {
        const row = document.createElement("div");
        row.className = "msg-row user";
        const wrapper = document.createElement("div");
        wrapper.className = "img-wrapper";
        const img = document.createElement("img");
        img.className = "msg-image";
        img.src = src;
        img.alt = name;
        img.onclick = () => openLightbox(src, name);
        const dlOverlay = document.createElement("div");
        dlOverlay.className = "img-dl-overlay";
        const dlLink = document.createElement("a");
        dlLink.className = "img-dl-btn";
        dlLink.href = src;
        dlLink.download = name;
        dlLink.innerHTML = `<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>`;
        dlLink.onclick = (e) => e.stopPropagation();
        dlOverlay.appendChild(dlLink);
        wrapper.appendChild(img);
        wrapper.appendChild(dlOverlay);
        row.appendChild(wrapper);
        messagesDiv.appendChild(row);
        scrollBottom();
        return row;
      }

      function appendThinking() {
        const row = document.createElement("div");
        row.className = "msg-row bot";
        const wrap = document.createElement("div");
        wrap.className = "thinking-wrap";
        wrap.innerHTML = `<div class="thinking-label"><span class="thinking-dot"></span><span>جاري التفكير…</span></div><div class="thinking-bars"><div class="think-bar"></div><div class="think-bar"></div><div class="think-bar"></div></div>`;
        row.appendChild(mkAv());
        row.appendChild(wrap);
        messagesDiv.appendChild(row);
        scrollBottom();
        return row;
      }

      function scrollBottom() {
        messagesWrap.scrollTop = messagesWrap.scrollHeight;
      }
      function escHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      messageInput.addEventListener("input", function () {
        this.style.height = "auto";
        this.style.height = Math.min(this.scrollHeight, 150) + "px";
      });

      // ── Delete modal ──────────────────────────────────────────────────
      const deleteModalOverlay = document.getElementById("deleteModalOverlay");
      document
        .getElementById("openDeleteModalBtn")
        .addEventListener("click", () =>
          deleteModalOverlay.classList.add("active")
        );
      document
        .getElementById("cancelDeleteBtn")
        .addEventListener("click", () =>
          deleteModalOverlay.classList.remove("active")
        );
      deleteModalOverlay.addEventListener("click", (e) => {
        if (e.target === deleteModalOverlay)
          deleteModalOverlay.classList.remove("active");
      });
      document
        .getElementById("confirmDeleteBtn")
        .addEventListener("click", () => {
          if (!currentConversationId) {
            deleteModalOverlay.classList.remove("active");
            return;
          }
          chatSocket.send(
            JSON.stringify({
              type: "delete_conversation",
              conversation_id: currentConversationId,
            })
          );
          deleteModalOverlay.classList.remove("active");
        });

      // ── Voice Input ───────────────────────────────────────────────────
      const micBtn = document.getElementById("mic-btn");
      const SpeechRecognition =
        window.SpeechRecognition || window.webkitSpeechRecognition;
      let recognition = null,
        isRecording = false,
        isStopping = false;
      let finalTranscript = "",
        originalValue = "";
      if (!SpeechRecognition) {
        micBtn.style.display = "none";
      } else {
        recognition = new SpeechRecognition();
        recognition.lang = "ar-EG";
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.onresult = function (event) {
          if (!isRecording) return;
          let interim = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const t = event.results[i][0].transcript;
            if (event.results[i].isFinal) finalTranscript += t + " ";
            else interim = t;
          }
          messageInput.value = originalValue + finalTranscript + interim;
          messageInput.style.height = "auto";
          messageInput.style.height =
            Math.min(messageInput.scrollHeight, 160) + "px";
        };
        recognition.onend = function () {
          if (isRecording && !isStopping) {
            setTimeout(() => {
              if (isRecording && !isStopping) {
                try {
                  recognition.start();
                } catch (e) {
                  isRecording = false;
                  micBtn.classList.remove("recording");
                }
              }
            }, 300);
          }
          isStopping = false;
        };
        recognition.onerror = function (event) {
          if (event.error === "not-allowed") {
            alert("محتاج إذن الميكروفون");
            isRecording = false;
            micBtn.classList.remove("recording");
            finalTranscript = "";
          }
        };
        micBtn.onclick = function () {
          if (!isRecording) {
            originalValue = messageInput.value;
            finalTranscript = "";
            isRecording = true;
            micBtn.classList.add("recording");
            recognition.start();
          } else {
            isRecording = false;
            isStopping = true;
            micBtn.classList.remove("recording");
            recognition.abort();
            messageInput.value = messageInput.value.trim();
            messageInput.focus();
            finalTranscript = "";
          }
        };
      }

      // ── Sidebar ────────────────────────────────────────────────────────
      const sidebarEl = document.getElementById("sidebar");
      const sidebarOverlay = document.getElementById("sidebar-overlay");

      function openSidebar() {
        sidebarEl.classList.add("open");
        sidebarOverlay.classList.add("open");
      }
      function closeSidebar() {
        sidebarEl.classList.remove("open");
        sidebarOverlay.classList.remove("open");
      }

      document.getElementById("conversations-btn").onclick = () => {
        sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
      };
      sidebarOverlay.onclick = closeSidebar;
      document.getElementById("sidebar-toggle").onclick = () => {
        sidebarEl.classList.contains("open") ? closeSidebar() : openSidebar();
      };

      let openDropdownId = null;
      function closeAllDropdowns() {
        document.querySelectorAll(".conv-dropdown").forEach((d) => d.remove());
        openDropdownId = null;
      }
      document.addEventListener("click", closeAllDropdowns);

      function renderConversations(conversations) {
        const list = document.getElementById("conversations-list");
        list.innerHTML = "";
        if (!conversations.length) {
          list.innerHTML = `<div style="padding:24px 12px;text-align:center;color:var(--text-muted);font-size:12px;">مفيش محادثات سابقة</div>`;
          return;
        }
        conversations.forEach((conv) => {
          const item = document.createElement("div");
          item.className =
            "conv-item" +
            (conv.conversation_id === currentConversationId ? " active" : "");
          let dateStr = "";
          try {
            dateStr = new Date(conv.updated_at).toLocaleDateString("ar-EG", {
              month: "short",
              day: "numeric",
            });
          } catch (_) {}
          item.innerHTML = `
      <div class="conv-info">
        <div class="conv-title">${escHtml(conv.title || "محادثة جديدة")}</div>
        <div class="conv-date">${dateStr}</div>
      </div>
      <button class="conv-menu-btn" title="خيارات">⋮</button>`;

          item.addEventListener("click", (e) => {
            if (
              e.target.closest(".conv-menu-btn") ||
              e.target.closest(".conv-dropdown")
            )
              return;
            switchConversation(conv.conversation_id);
          });

          const menuBtn = item.querySelector(".conv-menu-btn");
          menuBtn.addEventListener("click", (e) => {
            e.stopPropagation();
            closeAllDropdowns();
            if (openDropdownId === conv.conversation_id) return;
            openDropdownId = conv.conversation_id;
            const dd = document.createElement("div");
            dd.className = "conv-dropdown";
            dd.innerHTML = `
        <div class="conv-dd-item" id="dd-rename">✏️ تعديل الاسم</div>
        <div class="conv-dd-item danger" id="dd-delete">🗑️ حذف المحادثة</div>`;
            item.appendChild(dd);
            dd.querySelector("#dd-rename").onclick = (ev) => {
              ev.stopPropagation();
              closeAllDropdowns();
              const newTitle = window.prompt(
                "اسم جديد للمحادثة:",
                conv.title || ""
              );
              if (newTitle && newTitle.trim()) {
                chatSocket.send(
                  JSON.stringify({
                    type: "rename_conversation",
                    conversation_id: conv.conversation_id,
                    title: newTitle.trim(),
                  })
                );
              }
            };
            dd.querySelector("#dd-delete").onclick = (ev) => {
              ev.stopPropagation();
              closeAllDropdowns();
              if (!window.confirm("تحذف المحادثة دي؟ مش هينفع ترجع فيها."))
                return;
              chatSocket.send(
                JSON.stringify({
                  type: "delete_conversation",
                  conversation_id: conv.conversation_id,
                })
              );
            };
          });
          list.appendChild(item);
        });
      }

      function resetChatUI() {
        messagesDiv.querySelectorAll(".msg-row").forEach((r) => r.remove());
        if (welcomeScreen) {
          welcomeScreen.style.display = "";
          welcomeScreen.classList.remove("hiding");
        }
        suggestFab.classList.remove("visible");
        typingRow = null;
        currentBotBubble = null;
        streamBuffer = "";
        queuedText = null;
        streamStopped = false;
        setStreamingUI(false);
        sendBtn.disabled = false;
        if (disconnectBanner) {
          disconnectBanner.remove();
          disconnectBanner = null;
        }
      }

      function switchConversation(conversationId) {
        if (conversationId === currentConversationId) {
          closeSidebar();
          return;
        }
        isIntentionalDisconnect = true;
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (chatSocket) {
          chatSocket.onclose = null;
          chatSocket.close();
        }
        resetChatUI();
        currentConversationId = conversationId;
        closeSidebar();
        connectWebSocket(conversationId);
        attachSocketHandlers();
      }

      document.getElementById("new-chat-btn").onclick = () => {
        isIntentionalDisconnect = true;
        clearTimeout(reconnectTimer);
        reconnectTimer = null;
        if (chatSocket) {
          chatSocket.onclose = null;
          chatSocket.close();
        }
        resetChatUI();
        currentConversationId = null;
        closeSidebar();
        connectWebSocket(null);
        attachSocketHandlers();
      };
      (function setupShareButton() {
        const shareBtn = document.querySelector(".btn-share");
        if (!shareBtn) return;

        shareBtn.onclick = async function () {
          if (!currentConversationId) {
            showToast("ابدأ محادثة الأول عشان تقدر تشاركها!", "warn");
            return;
          }

          const token = localStorage.getItem("access_token");
          if (!token) {
            showToast("لازم تكون مسجّل دخول", "error");
            return;
          }

          shareBtn.disabled = true;
          shareBtn.textContent = "…";

          try {
            const res = await fetch("/api/share/", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                token: token,
                conversation_id: currentConversationId,
              }),
            });

            const data = await res.json();

            if (!res.ok) {
              showToast(data.error || "فشل إنشاء الرابط", "error");
              return;
            }

            const fullUrl = window.location.origin + data.share_url;

            // نسخ الرابط للـ clipboard
            try {
              await navigator.clipboard.writeText(fullUrl);
              showToast("✅ تم نسخ رابط المشاركة!", "success");
            } catch (_) {
              // fallback: show modal
              showShareModal(fullUrl, data.title);
            }
          } catch (err) {
            showToast("حدث خطأ: " + err.message, "error");
          } finally {
            shareBtn.disabled = false;
            shareBtn.textContent = "مشاركة";
          }
        };
      })();

      // ─────────────────────────────────────────────────────────────────
      // 2. Tool pills (بحث / بحث عميق / أدوات)
      // ─────────────────────────────────────────────────────────────────

      (function setupToolPills() {
        // بيجيب كل الـ tool-pill buttons بالترتيب
        const pills = document.querySelectorAll(".tool-pill");
        if (!pills.length) return;

        // pill[0] = بحث
        // pill[1] = بحث عميق
        // pill[2] = أدوات

        // ── بحث ──
        if (pills[0]) {
          pills[0].onclick = function () {
            togglePillActive(this, "search");
          };
        }

        // ── بحث عميق ──
        if (pills[1]) {
          pills[1].onclick = function () {
            togglePillActive(this, "deep_search");
          };
        }

        // ── أدوات (dropdown) ──
        if (pills[2]) {
          pills[2].onclick = function (e) {
            e.stopPropagation();
            toggleToolsDropdown(this);
          };
        }

        // active pill state
        let activePillMode = null;

        function togglePillActive(btn, mode) {
          // reset كل الـ pills
          pills.forEach((p) => p.classList.remove("pill-active"));

          if (activePillMode === mode) {
            // toggle off
            activePillMode = null;
            clearPillPrefix();
          } else {
            activePillMode = mode;
            btn.classList.add("pill-active");
            setPillPrefix(mode);
          }
        }

        function setPillPrefix(mode) {
          // بيضيف prefix مخفي للـ messageInput حتى الـ backend يتعرف عليه
          // بنحفظ الـ prefix في data attribute
          messageInput.dataset.pillPrefix =
            mode === "search"
              ? "[CMD:SEARCH] "
              : "[CMD:SEARCH] بحث عميق ومفصل جداً عن: ";
        }

        function clearPillPrefix() {
          delete messageInput.dataset.pillPrefix;
        }

        // نعمل override للـ sendMessage عشان يحط الـ prefix
        const _originalSendMessage = window._originalSendMessage || sendMessage;
        if (!window._pillPrefixPatched) {
          window._pillPrefixPatched = true;
          const origSend = sendMessage;

          // patch: نضيف الـ prefix للـ message قبل الإرسال
          const origInput = messageInput;
          const origGetValue = Object.getOwnPropertyDescriptor(
            HTMLTextAreaElement.prototype,
            "value"
          );

          // بدل ما نعمل monkey patch صعب،
          // هنعمل intercept في الـ sendMessage بدل ذلك
          // عن طريق الاستماع لـ keydown وـ send btn بعد ما ضافهم الكود الأصلي
          // الحل الأبسط: patch الـ chatSocket.send

          const origWsSend = WebSocket.prototype.send;
          WebSocket.prototype.send = function (data) {
            try {
              const parsed = JSON.parse(data);
              if (parsed.message && messageInput.dataset.pillPrefix) {
                // لو الرسالة مش بدأت بـ [CMD بالفعل
                if (!parsed.message.startsWith("[CMD:")) {
                  parsed.message =
                    messageInput.dataset.pillPrefix + parsed.message;
                  data = JSON.stringify(parsed);
                }
              }
            } catch (_) {}
            return origWsSend.call(this, data);
          };
        }

        // tools dropdown
        let toolsDropdown = null;

        function toggleToolsDropdown(btn) {
          if (toolsDropdown) {
            toolsDropdown.remove();
            toolsDropdown = null;
            return;
          }

          toolsDropdown = document.createElement("div");
          toolsDropdown.className = "tools-dropdown";
          toolsDropdown.innerHTML = `
      <div class="tools-dd-item" data-cmd="PDF">
        <span>📄</span><div><b>تحليل PDF</b><p>اطرح سؤالاً على ملف PDF</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="IMAGE_GEN">
        <span>🎨</span><div><b>توليد صورة</b><p>أنشئ صورة من وصف</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="IMAGE_ANALYZE">
        <span>🖼️</span><div><b>تحليل صورة</b><p>حلّل صورة مرفوعة</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="CODE">
        <span>💻</span><div><b>تنفيذ كود</b><p>اكتب وشغّل Python</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="WORD">
        <span>📝</span><div><b>إنشاء Word</b><p>احصل على ملف .docx</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="EXCEL">
        <span>📊</span><div><b>إنشاء Excel</b><p>احصل على ملف .xlsx</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="YOUTUBE">
        <span>📺</span><div><b>تلخيص يوتيوب</b><p>لخّص فيديو من رابطه</p></div>
      </div>
      <div class="tools-dd-item" data-cmd="CALC">
        <span>🧮</span><div><b>حسابات</b><p>حل مسائل رياضية</p></div>
      </div>
    `;

          // position
          const rect = btn.getBoundingClientRect();
          toolsDropdown.style.cssText = `
      position:fixed;
      bottom:${window.innerHeight - rect.top + 8}px;
      right:${window.innerWidth - rect.right}px;
      background:var(--bg2,#141417);
      border:1px solid var(--card-border,rgba(255,255,255,0.08));
      border-radius:14px;
      box-shadow:0 8px 40px rgba(0,0,0,0.4);
      z-index:200;
      min-width:220px;
      overflow:hidden;
      backdrop-filter:blur(20px);
    `;

          toolsDropdown.querySelectorAll(".tools-dd-item").forEach((item) => {
            item.addEventListener("click", () => {
              const cmd = item.dataset.cmd;
              const labelMap = {
                PDF: "تحليل PDF",
                IMAGE_GEN: "توليد صورة",
                IMAGE_ANALYZE: "تحليل صورة",
                CODE: "تنفيذ كود",
                WORD: "إنشاء Word",
                EXCEL: "إنشاء Excel",
                YOUTUBE: "تلخيص يوتيوب",
                CALC: "حسابات",
              };
              const iconMap = {
                PDF: "📄",
                IMAGE_GEN: "🎨",
                IMAGE_ANALYZE: "🖼️",
                CODE: "💻",
                WORD: "📝",
                EXCEL: "📊",
                YOUTUBE: "📺",
                CALC: "🧮",
              };
              const prefixMap = {
                PDF: "[CMD:PDF] ",
                IMAGE_GEN: "[CMD:IMAGE] ",
                IMAGE_ANALYZE: "[CMD:ANALYZE_IMAGE] ",
                CODE: "[CMD:CODE] ",
                WORD: "[CMD:WORD] ",
                EXCEL: "[CMD:EXCEL] ",
                YOUTUBE: "[CMD:YOUTUBE] ",
                CALC: "[CMD:CALC] ",
              };
              activateChip({
                icon: iconMap[cmd],
                title: labelMap[cmd],
                chipPrompt: prefixMap[cmd],
              });
              toolsDropdown.remove();
              toolsDropdown = null;
              pills.forEach((p) => p.classList.remove("pill-active"));
              activePillMode = null;
              clearPillPrefix();
            });
          });

          document.body.appendChild(toolsDropdown);
          setTimeout(() => {
            document.addEventListener("click", function closeDD(ev) {
              if (!toolsDropdown) return;
              if (!toolsDropdown.contains(ev.target)) {
                toolsDropdown.remove();
                toolsDropdown = null;
              }
              document.removeEventListener("click", closeDD);
            });
          }, 10);
        }
      })();

      // ─────────────────────────────────────────────────────────────────
      // 3. Styles للـ pills والـ dropdown
      // ─────────────────────────────────────────────────────────────────

      (function injectStyles() {
        const style = document.createElement("style");
        style.textContent = `
    /* Active pill */
    .tool-pill.pill-active {
      background: var(--accent-dim, rgba(200,184,154,0.12));
      border-color: rgba(200,184,154,0.25) !important;
      color: var(--accent, #c8b89a) !important;
    }
    .tool-pill.pill-active svg {
      stroke: var(--accent, #c8b89a);

    /* Tools dropdown */
    .tools-dd-item {
      display: flex;
      align-items: center;

    .tools-dd-item:last-child { border-bottom: none; }
    .tools-dd-item:hover { background: var(--card-bg-hover, rgba(255,255,255,0.06)); }
    .tools-dd-item > span { font-size: 18px; flex-shrink: 0; }
    .tools-dd-item b { font-size: 13px; color: var(--text-primary,#f0ede8); font-weight:500; }
    .tools-dd-item p { font-size: 11px; color: var(--text-muted,#5c5854); margin-top:1px; }

    /* Toast */
    .chat-toast {
      position: fixed;

      transform: translateX(-50%) translateY(0);

      color: var(--text-primary, #f0ede8);

    }
    .chat-toast.success { border-color: rgba(74,222,128,0.3); color:#4ade80; }

    @keyframes toastIn {

    /* Share modal */
    #share-modal-overlay {

    #share-url-input {
      width: 100%; padding: 9px 12px;
      background: rgba(255,255,255,0.05);

      font-size: 12.5px; outline: none;
      direction: ltr; text-align: left;
    }
    .share-modal-actions { display:flex; gap:8px; margin-top:12px; justify-content:flex-end; }
    .share-copy-btn {
      padding: 7px 16px;
      background: var(--accent-dim,rgba(200,184,154,0.12));
      border: 1px solid rgba(200,184,154,0.2);
      border-radius: 8px;
      font-size: 13px; font-weight: 500;
      color: var(--accent,#c8b89a);
      cursor: pointer; font-family:inherit;
      transition: background .15s;
    }
    .share-copy-btn:hover { background: rgba(200,184,154,0.2); }
    .share-close-btn {
      padding: 7px 16px;
      background: var(--btn-primary,rgba(255,255,255,0.07));
      border: 1px solid var(--card-border,rgba(255,255,255,0.1));
      border-radius: 8px;

      transition: background .15s;
    }
  `;
        document.head.appendChild(style);
      })();

      // ─────────────────────────────────────────────────────────────────
      // 4. Helper functions
      // ─────────────────────────────────────────────────────────────────

      function showToast(msg, type = "info") {
        // ازل أي toast موجود
        document.querySelectorAll(".chat-toast").forEach((t) => t.remove());
        const t = document.createElement("div");
        t.className = `chat-toast ${type}`;
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
          t.style.opacity = "0";
          t.style.transition = "opacity .3s";
          setTimeout(() => t.remove(), 300);
        }, 3000);
      }

      function showShareModal(url, title) {
        const overlay = document.createElement("div");
        overlay.id = "share-modal-overlay";
        overlay.innerHTML = `
    <div id="share-modal-card">
      <h3>🔗 رابط المشاركة جاهز</h3>
      <p>المحادثة: ${escHtml(title || "محادثة")}</p>
      <input id="share-url-input" type="text" value="${escHtml(
        url
      )}" readonly onclick="this.select()" />
      <div class="share-modal-actions">
        <button class="share-close-btn" onclick="this.closest('#share-modal-overlay').remove()">إغلاق</button>
        <button class="share-copy-btn" onclick="
          navigator.clipboard.writeText('${escHtml(url)}').then(()=>{
            this.textContent='✅ تم النسخ!';
            setTimeout(()=>this.textContent='نسخ الرابط',2000);
          });
        ">نسخ الرابط</button>
      </div>
    </div>
  `;
        overlay.addEventListener("click", (e) => {
          if (e.target === overlay) overlay.remove();
        });
        document.body.appendChild(overlay);
      }
    </script>
  </body>
