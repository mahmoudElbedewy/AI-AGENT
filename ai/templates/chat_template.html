<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link
      rel="icon"
      type="image/png"
      href="http://googleusercontent.com/image_collection/image_retrieval/3634674207365864610_0"
    />
    <style>
      /* ── Reset & Base ─────────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }

      :root {
        --bg: #1a1a1f;
        --bg2: #141417;
        --sidebar-bg: rgba(20, 20, 23, 0.92);
        --sidebar-w: 240px;
        --card-bg: rgba(255, 255, 255, 0.05);
        --card-bg-hover: rgba(255, 255, 255, 0.08);
        --card-border: rgba(255, 255, 255, 0.08);
        --navbar-h: 56px;
        --text-primary: #f0ede8;
        --text-secondary: #9a9490;
        --text-muted: #5c5854;
        --accent: #c8b89a;
        --accent-dim: rgba(200, 184, 154, 0.12);
        --accent-glow: rgba(200, 184, 154, 0.08);
        --btn-primary: rgba(255, 255, 255, 0.1);
        --btn-hover: rgba(255, 255, 255, 0.14);
        --chip-bg: rgba(255, 255, 255, 0.06);
        --chip-hover: rgba(255, 255, 255, 0.1);
        --send-bg: #f0ede8;
        --send-color: #1a1a1f;
        --r-sm: 6px;
        --r-md: 10px;
        --r-lg: 14px;
        --r-xl: 18px;
        --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.3);
      }

      [data-theme="light"] {
        --bg: #fbf7ef;
        --bg2: #f3ede1;
        --sidebar-bg: rgba(243, 237, 225, 0.9);
        --card-bg: rgba(225, 229, 230, 0.5);
        --card-bg-hover: rgba(225, 229, 230, 0.75);
        --card-border: rgba(189, 196, 198, 0.5);
        --text-primary: #24252d;
        --text-secondary: #61686b;
        --text-muted: #9a9490;
        --accent: #7c746f;
        --accent-dim: rgba(124, 116, 111, 0.1);
        --accent-glow: rgba(124, 116, 111, 0.05);
        --btn-primary: rgba(225, 229, 230, 0.7);
        --btn-hover: rgba(225, 229, 230, 1);
        --chip-bg: rgba(225, 229, 230, 0.5);
        --chip-hover: rgba(225, 229, 230, 0.8);
        --send-bg: #24252d;
        --send-color: #fbf7ef;
        --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.06);
      }

      body {
        font-family: "Inter", sans-serif;
        background: var(--bg);
        color: var(--text-primary);
        display: flex;
        height: 100vh;
      }

      /* ── Sidebar ──────────────────────────────────────────────────────── */
      #sidebar {
        width: var(--sidebar-w);
        height: 100vh;
        background: var(--sidebar-bg);
        backdrop-filter: blur(40px);
        border-left: 1px solid var(--card-border);
        display: flex;
        flex-direction: column;
        flex-shrink: 0;
        transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 100;
        overflow: hidden;
      }

      .sidebar-top {
        padding: 16px 12px 8px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      /* New Chat button */
      .btn-new-chat {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: var(--btn-primary);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        color: var(--text-primary);
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        width: 100%;
        transition: background 0.15s, border-color 0.15s;
        font-family: "Inter", sans-serif;
      }
      .btn-new-chat:hover {
        background: var(--btn-hover);
      }
      .btn-new-chat svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      /* Sidebar nav items */
      .sidebar-nav {
        padding: 4px 8px;
        display: flex;
        flex-direction: column;
        gap: 1px;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 8px 10px;
        border-radius: var(--r-md);
        color: var(--text-secondary);
        font-size: 13px;
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        user-select: none;
      }
      .nav-item:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }
      .nav-item svg {
        width: 15px;
        height: 15px;
        flex-shrink: 0;
      }

      /* Chats section */
      .sidebar-section-label {
        padding: 6px 18px 4px;
        font-size: 11px;
        font-weight: 500;
        color: var(--text-muted);
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #conversations-list {
        flex: 1;
        overflow-y: auto;
        padding: 0 8px 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--card-border) transparent;
      }
      #conversations-list::-webkit-scrollbar {
        width: 4px;
      }
      #conversations-list::-webkit-scrollbar-thumb {
        background: var(--card-border);
        border-radius: 4px;
      }

      .conv-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 10px;
        border-radius: var(--r-md);
        cursor: pointer;
        position: relative;
        transition: background 0.15s;
      }
      .conv-item:hover {
        background: var(--card-bg-hover);
      }
      .conv-item.active {
        background: var(--card-bg-hover);
      }

      .conv-info {
        flex: 1;
        min-width: 0;
      }
      .conv-title {
        font-size: 12.5px;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        line-height: 1.4;
      }
      .conv-date {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      .conv-menu-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        width: 22px;
        height: 22px;
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.15s, background 0.15s;
        flex-shrink: 0;
      }
      .conv-item:hover .conv-menu-btn {
        opacity: 1;
      }
      .conv-menu-btn:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }

      .conv-dropdown {
        position: absolute;
        top: 100%;
        left: 8px;
        background: var(--bg2);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-card);
        z-index: 200;
        min-width: 160px;
        overflow: hidden;
        backdrop-filter: blur(20px);
      }
      .conv-dd-item {
        padding: 9px 14px;
        font-size: 12.5px;
        color: var(--text-primary);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: 8px;
        transition: background 0.12s;
      }
      .conv-dd-item:hover {
        background: var(--card-bg-hover);
      }
      .conv-dd-item.danger {
        color: #e05555;
      }
      .conv-dd-item.danger:hover {
        background: rgba(224, 85, 85, 0.1);
      }

      /* Sidebar bottom */
      .sidebar-bottom {
        padding: 12px;
        border-top: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .sidebar-user {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .user-avatar {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: rgba(255, 115, 0, 0.7);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-primary);
        flex-shrink: 0;
      }
      .user-name-text {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-primary);
        max-width: 110px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .icon-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        width: 28px;
        height: 28px;
        border-radius: var(--r-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.15s, color 0.15s;
        flex-shrink: 0;
      }
      .icon-btn:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }
      .icon-btn svg {
        width: 15px;
        height: 15px;
      }

      /* ── Main area ────────────────────────────────────────────────────── */
      #main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        position: relative;
        overflow: hidden;
      }

      /* ── Navbar ───────────────────────────────────────────────────────── */
      #navbar {
        height: var(--navbar-h);
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 16px;
        border-bottom: 1px solid var(--card-border);
        background: var(--bg);
        flex-shrink: 0;
        z-index: 50;
      }

      .navbar-left {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      /* Mobile sidebar toggle */
      #sidebar-toggle {
        display: none;
      }

      .logo-mark {
        display: flex;
        align-items: center;
        gap: 6px;
        text-decoration: none;
      }
      .logo-icon {
        width: 24px;
        height: 24px;
        background: linear-gradient(135deg, var(--accent) 0%, #a0907a 100%);
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .logo-icon svg {
        width: 14px;
        height: 14px;
        stroke: var(--bg);
      }
      .logo-name {
        font-family: "Playfair Display", serif;
        font-size: 17px;
        color: var(--text-primary);
        font-weight: 400;
        letter-spacing: -0.02em;
      }
      .navbar-sep {
        color: var(--text-muted);
        font-size: 18px;
        font-weight: 300;
        margin: 0 2px;
      }
      .model-badge {
        display: flex;
        align-items: center;
        gap: 5px;
        font-size: 11.5px;
        font-weight: 600;
        color: var(--text-secondary);
        cursor: pointer;
        padding: 3px 6px;
        border-radius: var(--r-sm);
        transition: background 0.15s;
      }
      .model-badge:hover {
        background: var(--card-bg-hover);
      }
      .model-badge svg {
        width: 13px;
        height: 13px;
      }

      .navbar-right {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .btn-share {
        padding: 4px 12px;
        background: var(--btn-primary);
        border: 1px solid var(--card-border);
        border-radius: var(--r-sm);
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        cursor: pointer;
        font-family: "Inter", sans-serif;
        transition: background 0.15s;
      }
      .btn-share:hover {
        background: var(--btn-hover);
      }

      #theme-btn {
      }
      .nav-avatar {
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: rgba(255, 115, 0, 0.65);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 11px;
        font-weight: 600;
        color: white;
        cursor: pointer;
      }

      /* ── Messages area ────────────────────────────────────────────────── */
      #messages-wrap {
        flex: 1;
        overflow-y: auto;
        overflow-x: hidden;
        scrollbar-width: thin;
        scrollbar-color: var(--card-border) transparent;
        position: relative;
      }
      #messages-wrap::-webkit-scrollbar {
        width: 4px;
      }
      #messages-wrap::-webkit-scrollbar-thumb {
        background: var(--card-border);
        border-radius: 4px;
      }

      #messages {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 24px 0 120px;
        max-width: 680px;
        margin: 0 auto;
        width: 100%;
        padding-left: 20px;
        padding-right: 20px;
      }

      /* ── Welcome screen ───────────────────────────────────────────────── */
      #welcome-screen {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        gap: 24px;
        z-index: 10;
        pointer-events: none;
        transition: opacity 0.3s, transform 0.3s;
      }
      #welcome-screen.hiding {
        opacity: 0;
        transform: translateY(-16px);
      }
      #welcome-screen > * {
        pointer-events: auto;
      }

      .welcome-heading {
        text-align: center;
        line-height: 1.15;
      }
      .welcome-heading .hello {
        font-family: "Playfair Display", serif;
        font-size: 38px;
        font-weight: 400;
        color: var(--text-secondary);
        display: block;
      }
      .welcome-heading .hello em {
        font-style: italic;
        color: var(--accent);
      }
      .welcome-heading .subtitle {
        font-family: "Playfair Display", serif;
        font-size: 38px;
        font-weight: 400;
        color: var(--text-primary);
        display: block;
        margin-top: 2px;
      }

      /* Quick-action chips under welcome */
      #welcome-caps-grid {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
        max-width: 640px;
      }
      .welcome-cap {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 14px;
        background: var(--chip-bg);
        border: 1px solid var(--card-border);
        border-radius: 100px;
        cursor: pointer;
        transition: background 0.15s, border-color 0.15s;
        font-size: 12.5px;
        color: var(--text-primary);
        white-space: nowrap;
        backdrop-filter: blur(12px);
      }
      .welcome-cap:hover {
        background: var(--chip-hover);
        border-color: rgba(255, 255, 255, 0.15);
      }
      .welcome-cap .cap-icon {
        font-size: 14px;
      }
      .welcome-cap .cap-title {
        font-weight: 500;
      }
      .welcome-cap .cap-sub {
        display: none;
      }

      /* ── Message rows ─────────────────────────────────────────────────── */
      .msg-row {
        display: flex;
        gap: 10px;
        align-items: flex-start;
        animation: msgIn 0.2s ease;
      }
      @keyframes msgIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .msg-row.user {
        flex-direction: row-reverse;
      }
      .msg-row.user .msg-bubble {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--r-lg) var(--r-lg) 4px var(--r-lg);
        padding: 10px 14px;
        max-width: 75%;
        font-size: 14px;
        line-height: 1.6;
        color: var(--text-primary);
        word-break: break-word;
      }

      .bot-av {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: linear-gradient(135deg, var(--accent) 0%, #a0907a 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 4px;
      }
      .bot-av svg {
        width: 14px;
        height: 14px;
        stroke: var(--bg);
        fill: none;
      }

      .msg-row.bot .msg-bubble {
        background: transparent;
        font-size: 14px;
        line-height: 1.7;
        color: var(--text-primary);
        max-width: calc(100% - 38px);
        flex: 1;
        word-break: break-word;
      }

      /* Markdown inside bot bubbles */
      .msg-row.bot .msg-bubble h1,
      .msg-row.bot .msg-bubble h2,
      .msg-row.bot .msg-bubble h3 {
        font-family: "Playfair Display", serif;
        margin: 16px 0 8px;
        color: var(--text-primary);
        font-weight: 600;
      }
      .msg-row.bot .msg-bubble h1 {
        font-size: 20px;
      }
      .msg-row.bot .msg-bubble h2 {
        font-size: 17px;
      }
      .msg-row.bot .msg-bubble h3 {
        font-size: 15px;
      }
      .msg-row.bot .msg-bubble p {
        margin: 6px 0;
      }
      .msg-row.bot .msg-bubble ul,
      .msg-row.bot .msg-bubble ol {
        padding-right: 20px;
        margin: 6px 0;
      }
      .msg-row.bot .msg-bubble li {
        margin: 3px 0;
      }
      .msg-row.bot .msg-bubble strong {
        color: var(--text-primary);
      }
      .msg-row.bot .msg-bubble code {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 4px;
        padding: 1px 5px;
        font-size: 12.5px;
        font-family: "Fira Code", monospace;
      }
      .msg-row.bot .msg-bubble a {
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 3px;
      }

      /* ── Code blocks ──────────────────────────────────────────────────── */
      .code-block {
        background: var(--bg2);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        overflow: hidden;
        margin: 10px 0;
      }
      .code-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-bottom: 1px solid var(--card-border);
        background: rgba(255, 255, 255, 0.03);
      }
      .code-lang {
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .code-actions {
        display: flex;
        gap: 6px;
      }
      .code-action-btn {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 9px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: 5px;
        font-size: 11.5px;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s, color 0.15s;
        font-family: "Inter", sans-serif;
      }
      .code-action-btn:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }
      .code-action-btn.copied {
        color: #4ade80;
        border-color: rgba(74, 222, 128, 0.3);
      }
      .code-action-btn svg {
        width: 12px;
        height: 12px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      .code-body {
        overflow-x: auto;
      }
      .code-body pre {
        padding: 14px 16px;
        margin: 0;
        font-size: 12.5px;
        line-height: 1.7;
        font-family: "Fira Code", "Courier New", monospace;
        color: var(--text-primary);
        white-space: pre;
      }

      /* ── Thinking animation ───────────────────────────────────────────── */
      .thinking-wrap {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 4px 0;
      }
      .thinking-label {
        display: flex;
        align-items: center;
        gap: 7px;
        font-size: 12.5px;
        color: var(--text-muted);
      }
      .thinking-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--accent);
        animation: pulse 1.4s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 0.4;
          transform: scale(0.8);
        }
        50% {
          opacity: 1;
          transform: scale(1.1);
        }
      }
      .thinking-bars {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding-right: 0;
        max-width: 280px;
      }
      .think-bar {
        height: 10px;
        border-radius: 6px;
        background: var(--card-bg);
        animation: shimmer 1.6s ease-in-out infinite;
      }
      .think-bar:nth-child(1) {
        width: 75%;
        animation-delay: 0s;
      }
      .think-bar:nth-child(2) {
        width: 55%;
        animation-delay: 0.2s;
      }
      .think-bar:nth-child(3) {
        width: 85%;
        animation-delay: 0.4s;
      }
      @keyframes shimmer {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 0.6;
        }
      }

      /* ── Disconnect banner ────────────────────────────────────────────── */
      .disc-bubble {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 13px;
        color: var(--text-secondary);
        padding: 10px 0;
      }
      .disc-spinner {
        width: 14px;
        height: 14px;
        border: 2px solid var(--card-border);
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* ── File chip ────────────────────────────────────────────────────── */
      .file-chip {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 14px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--r-lg);
        cursor: pointer;
        max-width: 280px;
        transition: background 0.15s;
      }
      .file-chip:hover {
        background: var(--card-bg-hover);
      }
      .file-chip-ico {
        font-size: 22px;
      }
      .file-chip-name {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 180px;
      }
      .file-chip-sub {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      .msg-image {
        max-width: 340px;
        max-height: 280px;
        border-radius: var(--r-lg);
        cursor: zoom-in;
        display: block;
      }
      .img-wrapper {
        position: relative;
        display: inline-block;
      }
      .img-dl-overlay {
        position: absolute;
        bottom: 8px;
        left: 8px;
        opacity: 0;
        transition: opacity 0.15s;
      }
      .img-wrapper:hover .img-dl-overlay {
        opacity: 1;
      }
      .img-dl-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 30px;
        height: 30px;
        background: rgba(0, 0, 0, 0.5);
        backdrop-filter: blur(8px);
        border-radius: 8px;
        color: white;
        text-decoration: none;
      }
      .img-dl-btn svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: white;
        stroke-width: 2;
      }

      /* ── Input area ───────────────────────────────────────────────────── */
      #input-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 16px 24px 20px;
        background: linear-gradient(to top, var(--bg) 70%, transparent);
        backdrop-filter: blur(1px);
        z-index: 30;
      }

      .input-inner {
        max-width: 680px;
        margin: 0 auto;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* Active chip */
      #active-chip {
        display: none;
        align-items: center;
        gap: 8px;
        padding: 6px 10px 6px 12px;
        background: var(--accent-dim);
        border: 1px solid rgba(200, 184, 154, 0.2);
        border-radius: 100px;
        width: fit-content;
        animation: chipIn 0.2s ease;
      }
      #active-chip.visible {
        display: flex;
      }
      @keyframes chipIn {
        from {
          opacity: 0;
          transform: scale(0.95);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .chip-label {
        font-size: 12px;
        font-weight: 500;
        color: var(--accent);
        display: flex;
        align-items: center;
        gap: 5px;
      }
      #chip-remove-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        line-height: 1;
        transition: background 0.15s, color 0.15s;
      }
      #chip-remove-btn:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }

      /* Pending file preview */
      #pending-preview {
        display: none;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        animation: chipIn 0.2s ease;
      }
      #pending-preview.visible {
        display: flex;
      }
      #pp-visual {
        display: flex;
        align-items: center;
      }
      .pp-thumb {
        width: 40px;
        height: 40px;
        border-radius: 6px;
        object-fit: cover;
      }
      .pp-icon {
        font-size: 22px;
      }
      .pp-info {
        flex: 1;
        min-width: 0;
      }
      #pp-name {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text-primary);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      #pp-type {
        font-size: 11px;
        color: var(--text-muted);
        margin-top: 1px;
      }
      #pp-remove {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 18px;
        line-height: 1;
        padding: 2px;
        transition: color 0.15s;
      }
      #pp-remove:hover {
        color: var(--text-primary);
      }

      /* Chatbox */
      .chatbox {
        background: var(--card-bg);
        backdrop-filter: blur(42px);
        border: 1px solid var(--card-border);
        border-radius: var(--r-xl);
        padding: 14px 16px 10px;
        box-shadow: var(--shadow-card);
        transition: border-color 0.2s, box-shadow 0.2s;
      }
      .chatbox:focus-within {
        border-color: rgba(200, 184, 154, 0.25);
        box-shadow: var(--shadow-card), 0 0 0 3px var(--accent-glow);
      }

      #message-input {
        width: 100%;
        background: none;
        border: none;
        outline: none;
        resize: none;
        font-family: "Inter", sans-serif;
        font-size: 14px;
        color: var(--text-primary);
        line-height: 1.6;
        min-height: 22px;
        max-height: 150px;
        overflow-y: auto;
        scrollbar-width: none;
        caret-color: var(--accent);
      }
      #message-input::placeholder {
        color: var(--text-muted);
      }

      .chatbox-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 10px;
      }

      .toolbar-left {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      /* Toolbar pills */
      .tool-pill {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 4px 10px;
        background: none;
        border: 1px solid transparent;
        border-radius: 100px;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-secondary);
        cursor: pointer;
        transition: background 0.15s, color 0.15s, border-color 0.15s;
        font-family: "Inter", sans-serif;
        white-space: nowrap;
      }
      .tool-pill:hover {
        background: var(--card-bg-hover);
        border-color: var(--card-border);
        color: var(--text-primary);
      }
      .tool-pill svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex-shrink: 0;
      }

      /* attach round btn */
      .attach-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s;
        flex-shrink: 0;
      }
      .attach-btn:hover {
        background: var(--card-bg-hover);
      }
      .attach-btn svg {
        width: 13px;
        height: 13px;
        fill: none;
        stroke: var(--text-secondary);
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      .toolbar-right {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      /* mic button */
      #mic-btn {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: none;
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: var(--text-muted);
        transition: color 0.15s, background 0.15s;
        flex-shrink: 0;
      }
      #mic-btn:hover {
        background: var(--card-bg-hover);
        color: var(--text-primary);
      }
      #mic-btn.recording {
        color: #e05555;
        animation: micPulse 1.2s ease-in-out infinite;
      }
      @keyframes micPulse {
        0%,
        100% {
          box-shadow: 0 0 0 0 rgba(224, 85, 85, 0);
        }
        50% {
          box-shadow: 0 0 0 5px rgba(224, 85, 85, 0.15);
        }
      }
      #mic-btn svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }

      /* send button */
      #send-btn {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        background: var(--send-bg);
        border: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.15s, transform 0.1s;
        flex-shrink: 0;
      }
      #send-btn:hover {
        opacity: 0.85;
      }
      #send-btn:active {
        transform: scale(0.93);
      }
      #send-btn:disabled {
        opacity: 0.35;
        cursor: not-allowed;
      }
      #send-btn svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: var(--send-color);
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      #send-btn.stop-mode {
        background: #e05555;
      }
      #send-btn.stop-mode svg {
        fill: white;
        stroke: none;
      }

      /* input hint */
      #input-hint {
        text-align: center;
        font-size: 11px;
        color: var(--text-muted);
        opacity: 0.6;
      }

      /* ── Modals ───────────────────────────────────────────────────────── */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        backdrop-filter: blur(4px);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 500;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      .modal-overlay.active {
        opacity: 1;
        pointer-events: auto;
      }
      .modal-card {
        background: var(--bg2);
        border: 1px solid var(--card-border);
        border-radius: var(--r-xl);
        padding: 28px;
        max-width: 400px;
        width: 90%;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
        animation: modalIn 0.2s ease;
      }
      @keyframes modalIn {
        from {
          transform: scale(0.95);
          opacity: 0;
        }
        to {
          transform: scale(1);
          opacity: 1;
        }
      }
      .modal-title {
        font-size: 16px;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 8px;
      }
      .modal-body {
        font-size: 13.5px;
        color: var(--text-secondary);
        line-height: 1.6;
        margin-bottom: 20px;
      }
      .modal-actions {
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      .btn-cancel {
        padding: 7px 16px;
        background: var(--btn-primary);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        font-size: 13px;
        font-weight: 500;
        color: var(--text-primary);
        cursor: pointer;
        font-family: "Inter", sans-serif;
        transition: background 0.15s;
      }
      .btn-cancel:hover {
        background: var(--btn-hover);
      }
      .btn-danger {
        padding: 7px 16px;
        background: rgba(224, 85, 85, 0.15);
        border: 1px solid rgba(224, 85, 85, 0.3);
        border-radius: var(--r-md);
        font-size: 13px;
        font-weight: 500;
        color: #e05555;
        cursor: pointer;
        font-family: "Inter", sans-serif;
        transition: background 0.15s;
      }
      .btn-danger:hover {
        background: rgba(224, 85, 85, 0.25);
      }

      /* Lightbox */
      #lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 600;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
        cursor: zoom-out;
      }
      #lightbox.open {
        opacity: 1;
        pointer-events: auto;
      }
      #lightbox-img {
        max-width: 90vw;
        max-height: 85vh;
        border-radius: var(--r-lg);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
      }
      #lightbox-dl {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(8px);
        border-radius: var(--r-md);
        padding: 8px 14px;
        color: white;
        font-size: 13px;
        text-decoration: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      /* PDF Modal */
      #pdfModal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(4px);
        display: flex;
        flex-direction: column;
        z-index: 550;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s;
      }
      #pdfModal.open {
        opacity: 1;
        pointer-events: auto;
      }
      .pdf-modal-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--card-border);
        background: var(--bg2);
      }
      #pdfModalTitle {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-primary);
      }
      .pdf-close-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 20px;
        line-height: 1;
      }
      #pdfModalFrame {
        flex: 1;
        border: none;
        background: #fff;
      }

      /* ── Sidebar overlay (mobile) ─────────────────────────────────────── */
      #sidebar-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 90;
      }

      /* ── Suggestions floating panel ───────────────────────────────────── */
      #suggestions-fab {
        display: none;
        position: fixed;
        bottom: 90px;
        left: 20px;
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: var(--accent);
        border: none;
        cursor: pointer;
        align-items: center;
        justify-content: center;
        box-shadow: 0 4px 20px rgba(200, 184, 154, 0.35);
        transition: transform 0.2s, opacity 0.2s;
        z-index: 40;
        opacity: 0;
      }
      #suggestions-fab.visible {
        display: flex;
        opacity: 1;
      }
      #suggestions-fab svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: var(--bg);
        stroke-width: 2;
      }

      #suggestions-panel {
        position: fixed;
        bottom: 140px;
        left: 16px;
        background: var(--bg2);
        border: 1px solid var(--card-border);
        border-radius: var(--r-xl);
        padding: 16px;
        box-shadow: var(--shadow-card);
        z-index: 40;
        width: 260px;
        opacity: 0;
        transform: scale(0.95) translateY(8px);
        transform-origin: bottom left;
        pointer-events: none;
        transition: opacity 0.2s, transform 0.2s;
        backdrop-filter: blur(20px);
      }
      #suggestions-panel.open {
        opacity: 1;
        transform: scale(1) translateY(0);
        pointer-events: auto;
      }
      .sp-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
      }
      .sp-title {
        font-size: 12px;
        font-weight: 600;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      #sp-close-btn {
        background: none;
        border: none;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 16px;
      }
      #sp-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .sp-cap {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 10px;
        background: var(--chip-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--r-md);
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        color: var(--text-primary);
        transition: background 0.15s;
      }
      .sp-cap:hover {
        background: var(--chip-hover);
      }
      .sp-cap .cap-icon {
        font-size: 14px;
      }

      /* ── Responsive ───────────────────────────────────────────────────── */
      @media (max-width: 768px) {
        #sidebar {
          position: fixed;
          right: 0;
          top: 0;
          transform: translateX(100%);
        }
        #sidebar.open {
          transform: translateX(0);
        }
        #sidebar-overlay {
          display: block;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.2s;
        }
        #sidebar-overlay.open {
          opacity: 1;
          pointer-events: auto;
        }
        #sidebar-toggle {
          display: flex !important;
        }
        #messages {
          padding-left: 12px;
          padding-right: 12px;
        }
        #input-area {
          padding: 12px 12px 16px;
        }
      }

      /* ── Delete modal specific ────────────────────────────────────────── */
      #deleteModalOverlay {
        display: none;
      }
      #deleteModalOverlay.active {
        display: flex;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar -->

      <div class="sidebar-top">

      <!-- Chats label -->

      <!-- Conversations list -->
      <div id="conversations-list"></div>

      <!-- Bottom user area -->
      <div class="sidebar-bottom">
        <div class="sidebar-user">
          <div class="user-avatar" id="user-avatar-sidebar">A</div>
          <span class="user-name-text" id="user-name-chip">المستخدم</span>
        </div>
        <div style="display: flex; gap: 4px">
          <button class="icon-btn" id="theme-btn" title="تغيير المظهر">
            <svg
              id="icon-moon"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"

            >

            </svg>
            <svg
              id="icon-sun"

              style="display: none"
            >
              <circle cx="12" cy="12" r="5" />
              <line x1="12" y1="1" x2="12" y2="3" />
              <line x1="12" y1="21" x2="12" y2="23" />
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />

              <line x1="1" y1="12" x2="3" y2="12" />
              <line x1="21" y1="12" x2="23" y2="12" />
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
            </svg>
          </button>
          <button class="icon-btn" id="logout-btn" title="تسجيل الخروج">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
          </button>
        </div>
      </div>
    </aside>

    <!-- Main -->
    <main id="main">
      <!-- Navbar -->
      <nav id="navbar">
        <div class="navbar-left">
          <!-- Mobile sidebar toggle -->
          <button class="icon-btn" id="sidebar-toggle" style="display: none">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>

          <div class="logo-mark">
            <div class="logo-icon">
              <svg
                viewBox="0 0 24 24"

                stroke-linejoin="round"
              >
                <path

                />
              </svg>
            </div>
            <span class="logo-name">SALY</span>
          </div>

          <span class="navbar-sep">/</span>

          <div class="model-badge">
