<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>محادثة مشتركة</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#1a1a1f;color:#f0ede8;min-height:100vh;display:flex;flex-direction:column;}
#top-bar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;border-bottom:1px solid rgba(255,255,255,0.08);background:#141417;flex-shrink:0;}
.logo{font-family:'Playfair Display',serif;font-size:18px;color:#c8b89a;text-decoration:none;}
.badge{padding:4px 10px;background:rgba(200,184,154,0.12);border:1px solid rgba(200,184,154,0.2);border-radius:100px;font-size:11px;color:#c8b89a;}
#conv-title{text-align:center;padding:28px 24px 12px;font-family:'Playfair Display',serif;font-size:22px;color:#f0ede8;max-width:700px;margin:0 auto;width:100%;}
#messages-wrap{flex:1;overflow-y:auto;padding:0 24px 40px;}
#messages{max-width:700px;margin:0 auto;display:flex;flex-direction:column;gap:4px;}
.msg-row{display:flex;gap:10px;align-items:flex-start;animation:fadeIn .2s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.msg-row.user{flex-direction:row-reverse;}
.msg-row.user .msg-bubble{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:14px 14px 4px 14px;padding:10px 14px;max-width:75%;font-size:14px;line-height:1.6;}
.bot-av{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#c8b89a,#a0907a);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:4px;}
.bot-av svg{width:14px;height:14px;stroke:#1a1a1f;fill:none;}
.msg-row.bot .msg-bubble{font-size:14px;line-height:1.7;max-width:calc(100% - 38px);flex:1;}
.msg-row.bot .msg-bubble p{margin:6px 0;}
.msg-row.bot .msg-bubble ul,.msg-row.bot .msg-bubble ol{padding-right:18px;margin:6px 0;}
.msg-row.bot .msg-bubble code{background:rgba(255,255,255,0.08);border-radius:4px;padding:1px 5px;font-size:12.5px;}
.msg-row.bot .msg-bubble pre{background:rgba(255,255,255,0.05);border-radius:8px;padding:12px;overflow-x:auto;margin:8px 0;}
#loading{text-align:center;padding:60px;color:#5c5854;font-size:14px;}
#error-msg{text-align:center;padding:60px;color:#e05555;font-size:14px;}
#empty-badge{text-align:center;padding:20px;color:#5c5854;font-size:12px;border-top:1px solid rgba(255,255,255,0.05);margin-top:20px;}
</style>
</head>
<body>
<div id="top-bar">
  <a class="logo" href="/">Discourse</a>
  <span class="badge">محادثة مشتركة · للقراءة فقط</span>
</div>
<div id="conv-title"></div>
<div id="messages-wrap"><div id="messages"><div id="loading">جاري تحميل المحادثة…</div></div></div>

<script>
marked.setOptions({gfm:true,breaks:true});
const shareToken = "{{ share_token }}";

function mkAv(){
  const av=document.createElement('div');
  av.className='bot-av';
  av.innerHTML='<svg viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>';
  return av;
}

async function loadShared(){
  const msgs=document.getElementById('messages');
  try{
    const r=await fetch(`/api/shared/${shareToken}/`);
    const d=await r.json();
    if(!r.ok){
      msgs.innerHTML=`<div id="error-msg">${d.error||'خطأ'}</div>`;
      return;
    }
    document.getElementById('conv-title').textContent=d.title||'محادثة';
    msgs.innerHTML='';
    if(!d.messages||!d.messages.length){
      msgs.innerHTML='<div id="loading" style="color:#5c5854;">المحادثة فاضية</div>';
      return;
    }
    d.messages.forEach(m=>{
      let text=m.message;
      try{const p=JSON.parse(text);if(p.type)return;}catch(_){}
      const row=document.createElement('div');
      row.className=`msg-row ${m.role==='bot'?'bot':'user'}`;
      const bubble=document.createElement('div');
      bubble.className='msg-bubble';
      if(m.role==='bot'){
        bubble.innerHTML=marked.parse(text);
        row.appendChild(mkAv());
      } else {
        bubble.innerText=text;
      }
      row.appendChild(bubble);
      msgs.appendChild(row);
    });
    msgs.insertAdjacentHTML('beforeend','<div id="empty-badge">نهاية المحادثة · انضم وابدأ محادثتك الخاصة من <a href="/" style="color:#c8b89a;">الصفحة الرئيسية</a></div>');
  }catch(e){
    msgs.innerHTML=`<div id="error-msg">فشل تحميل المحادثة: ${e}</div>`;
  }
}
loadShared();
</script>
</body>
</html>
